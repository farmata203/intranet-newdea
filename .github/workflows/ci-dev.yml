name: "CI Pipeline - Dev"

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: latest
  DOCKER_REGISTRY: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image
        run: docker push $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          vuln-type: os,library
          ignore-unfixed: true

  push:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag and push validated image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest \
            ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev-validated
          docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev-validated